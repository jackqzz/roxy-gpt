<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>空间母号 · roxy-accounts</title>
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
  .page-container { max-width: 960px; }
  textarea.import-textarea {
    width: 100%; min-height: 90px; resize: vertical; font-size: 12px;
    font-family: ui-monospace, Menlo, Monaco, monospace;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
    background: #f8fafc; color: var(--text-main); outline: none;
  }
  textarea.import-textarea:focus { border-color: var(--primary); background: #fff; }
</style>
</head>
<body>
<nav class="sidebar" data-nav="mothers"></nav>
<div class="main">
<div class="page-container">
  <div class="page-header">
    <div class="title-group">
      <h1>空间母号</h1>
      <div class="subtitle">多个母号并行 —— 批量邀请子号进她的空间拿成员凭证 (区别于设置页的 Pat测试母号)</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i data-ic="plus"></i>导入母号（Roxy 窗口名 —— 每行一个）</div>
    <textarea class="import-textarea" id="imp-text" placeholder="youngj111&#10;mother02&#10;mother03"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-primary btn-sm" id="imp-btn">导入</button>
      <span class="subtitle" id="imp-msg"></span>
    </div>
    <div class="hint">母号要先在 Roxy 里开好窗口并登录 ChatGPT —— 邀请时系统会开她的窗口走后端批量邀请。设置页的 Pat测试母号独属 PAT 检验, 导入同名窗口会被跳过。</div>
  </div>

  <div class="card">
    <div class="card-title"><i data-ic="crown"></i>母号列表 <span class="subtitle" id="m-count" style="font-weight:400"></span></div>
    <table class="data-table">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="ck-all"></th>
          <th>Roxy 窗口名</th>
          <th style="width:300px">目标空间</th>
          <th style="width:220px">账单</th>
          <th style="width:110px">导入时间</th>
          <th style="width:260px;text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-outline btn-sm" id="bill-sel"><i data-ic="timer"></i>查账单选中</button>
      <button class="btn btn-outline btn-sm btn-danger" id="del-sel"><i data-ic="trash-2"></i>删除选中</button>
      <span class="hint" style="margin-top:0">「列空间」连母号窗口拉她拥有的空间 → 选一个保存, 之后「加入空间」就往这个空间拉人。不选则自动取她 owner 的第一个。「查账单」读席位价/续费时间(只读 preview, 不改订阅)。</span>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let mothers = [];
let sel = new Set();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1800);
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body) });
  return r.json();
}

async function load() {
  const r = await fetch("/api/mothers").then(r => r.json());
  mothers = r.mothers || [];
  $("m-count").textContent = mothers.length ? `(${mothers.length})` : "";
  render();
}

function billCell(b) {
  if (!b) return `<span class="pill pill-dim">未查</span>`;
  const bits = [];
  if (b.renewal) {
    const d = b.days;
    const cls = d != null && d <= 3 ? "pill-bad" : d != null && d <= 7 ? "pill-warn" : "pill-ok";
    bits.push(`<span class="pill ${cls}" title="续费/到期 ${esc(b.renewal)}${d != null ? ` · 剩 ${d} 天` : ""}">${esc(b.renewal.slice(5))}${d != null ? ` 剩${d}天` : ""}</span>`);
  }
  if (b.price) bits.push(`<span class="pill pill-dim" title="现在新增 1 席的即时费用 (按剩余天数折算)">${esc(b.price)}/席</span>`);
  if (b.seats != null) bits.push(`<span class="pill pill-dim" title="当前席位数">${b.seats}席</span>`);
  return bits.join(" ")
    + `<div class="subtitle" style="font-size:11px;margin-top:3px">查于 ${esc((b.at || "").slice(5, 16))}${b.ws_name ? " · " + esc(b.ws_name) : ""}</div>`;
}

function render() {
  $("tbody").innerHTML = mothers.map(m => {
    const ws = m.ws
      ? `<span class="pill pill-ok" title="${esc(m.ws)}">${esc(m.ws_name || m.ws.slice(0, 8))}</span>`
      : `<span class="pill pill-warn">未选 — 点列空间或加入时自动取</span>`;
    return `<tr>
      <td><input type="checkbox" class="ck" data-name="${esc(m.name)}" ${sel.has(m.name) ? "checked" : ""}></td>
      <td class="mono">${esc(m.name)}</td>
      <td>${ws}<span class="ws-slot" data-name="${esc(m.name)}"></span></td>
      <td>${billCell(m.bill)}</td>
      <td class="mono" style="color:var(--text-dim)">${esc((m.added_at || "").slice(0, 10))}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" data-act="bill" data-name="${esc(m.name)}">查账单</button>
        <button class="btn btn-ghost btn-sm" data-act="ws" data-name="${esc(m.name)}">列空间</button>
        <button class="btn btn-ghost btn-sm btn-danger" data-act="del" data-name="${esc(m.name)}">删</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:32px">暂无母号 —— 上方导入 Roxy 窗口名</td></tr>`;
}

async function doBilling(names, btn) {
  if (!names.length) return toast("先勾选母号");
  btn.disabled = true; const old = btn.innerHTML;
  btn.innerHTML = "查账单中…";
  const r = await post("/api/mothers/billing", { names }).catch(() => null);
  btn.disabled = false; btn.innerHTML = old;
  if (!r || r.error) return toast("✗ " + ((r && r.error) || "请求失败"));
  let ok = 0, fails = [];
  Object.entries(r.map || {}).forEach(([name, v]) => {
    const m = mothers.find(x => x.name === name);
    if (v.error) fails.push(`${name}: ${v.error}`);
    else if (m) { m.bill = v; if (!m.ws && v.ws_id) { m.ws = v.ws_id; m.ws_name = v.ws_name; } ok++; }
  });
  render();
  toast(`✓ ${ok} 个母号账单已更新`
    + (fails.length ? ` · ✗ ${fails.slice(0, 2).join(" · ")}` : ""));
}

$("imp-btn").onclick = async () => {
  const text = $("imp-text").value;
  if (!text.trim()) return toast("先填窗口名");
  const r = await post("/api/mothers/add", { names: text });
  if (r.error) return toast("✗ " + r.error);
  $("imp-msg").textContent = `✓ 导入 ${r.added} 个`
    + (r.dup ? ` · 重复 ${r.dup}` : "")
    + (r.skipped_pat ? ` · 跳过 ${r.skipped_pat} 个 (Pat测试母号不参与)` : "");
  $("imp-text").value = "";
  await load();
};

$("ck-all").onchange = e => {
  sel = e.target.checked ? new Set(mothers.map(m => m.name)) : new Set();
  render();
};
$("tbody").addEventListener("change", e => {
  const c = e.target.closest(".ck");
  if (!c) return;
  c.checked ? sel.add(c.dataset.name) : sel.delete(c.dataset.name);
});
$("tbody").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const name = b.dataset.name;
  if (b.dataset.act === "del") {
    if (!confirm(`删除母号 ${name}?`)) return;
    await post("/api/mothers/delete", { names: [name] });
    sel.delete(name);
    await load();
  }
  if (b.dataset.act === "bill") {
    doBilling([name], b);
  }
  if (b.dataset.act === "ws") {
    b.disabled = true;
    b.textContent = "连接中…";
    const r = await fetch("/api/mothers/workspaces?name="
      + encodeURIComponent(name)).then(r => r.json()).catch(() => null);
    b.disabled = false;
    b.textContent = "列空间";
    if (!r || r.error) return toast("✗ " + ((r && r.error) || "请求失败"));
    const wss = r.workspaces || [];
    if (!wss.length) return toast("母号没有任何空间");
    const slot = document.querySelector(`.ws-slot[data-name="${CSS.escape(name)}"]`);
    slot.innerHTML = ` <select class="form-select ws-pick" data-name="${esc(name)}" style="font-size:12px">`
      + `<option value="">— 选空间 —</option>`
      + wss.map(w => `<option value="${esc(w.id)}" data-n="${esc(w.name || w.id)}">${esc(w.name || w.id)} · ${esc(w.role)} · ${esc(w.plan)}</option>`).join("")
      + `</select>`;
    toast(`母号 ${r.email || name} · 拉到 ${wss.length} 个空间`);
  }
});
$("tbody").addEventListener("change", async e => {
  const s = e.target.closest(".ws-pick");
  if (!s || !s.value) return;
  const opt = s.options[s.selectedIndex];
  const r = await post("/api/mothers/set-ws",
    { name: s.dataset.name, ws: s.value,
      ws_name: opt.dataset.n || "" });
  if (r.error) return toast("✗ " + r.error);
  toast("✓ 空间已存");
  await load();
});

$("bill-sel").onclick = e => doBilling([...sel], e.target);

$("del-sel").onclick = async () => {
  if (!sel.size) return toast("先勾选母号");
  if (!confirm(`删除选中 ${sel.size} 个母号?`)) return;
  await post("/api/mothers/delete", { names: [...sel] });
  sel.clear();
  await load();
};

load();
</script>
</body>
</html>
